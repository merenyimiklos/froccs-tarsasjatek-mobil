name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Generate native Android scaffold
        run: |
          flutter create --project-name froccs_mobile --platforms android .
          # Flutter may generate a template widget test referencing MyApp.
          # Keep only our own rules-engine tests.
          rm -f test/widget_test.dart

      - name: Enable LAN connections for debug testing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          if 'android.permission.INTERNET' not in text:
              text = text.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          if 'android:usesCleartextTraffic' not in text:
              text = text.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(text)
          PY

      - name: Dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=FROCCS_SERVER=${{ vars.FROCCS_SERVER || 'wss://example.org' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: froccs-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
